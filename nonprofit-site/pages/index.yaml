        - platform: "facebook"
          url: "https://facebook.com/hopefoundation"
        - platform: "twitter"
          url: "https://twitter.com/hopefoundation"
        - platform: "linkedin"
          url: "https://linkedin.com/company/hopefoundation"
      phone: "+1 (555) 123-4567"
