badge: "FAQ"
title: "Frequently asked questions"
subtitle: "Everything you need to know about our platform."
items:
  - question: "How do I get started?"
    answer: "Simply sign up for a free trial, connect your code repository, and deploy your first application in minutes. No credit card required."
  - question: "What programming languages do you support?"
    answer: "We support all major languages and frameworks including JavaScript, Python, Go, Ruby, and more. If it can run in a container, we can deploy it."
  - question: "Can I migrate my existing applications?"
    answer: "Yes! Our migration tools make it easy to move your existing applications to SaaSify with minimal downtime."
  - question: "What kind of support do you offer?"
    answer: "We offer community support for Starter plans, priority email support for Pro plans, and 24/7 dedicated support for Enterprise customers."
  - question: "Is my data secure?"
    answer: "Absolutely. We use enterprise-grade encryption, regular security audits, and comply with SOC 2 and GDPR requirements."
