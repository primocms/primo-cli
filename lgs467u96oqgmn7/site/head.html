<meta property="og:site_name" content={site_name} />
<link rel="icon" href={favicon.url} />
<meta name="view-transition" content="same-origin" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pala-css@latest/reset.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pala-css@latest/components.css" />

<style>
  :root {
    --theme-primary-color: #6366f1;
    --theme-heading-font: 'Inter', system-ui, sans-serif;
    --theme-body-font: 'Inter', system-ui, sans-serif;
    --theme-radius: 12px;
    --prose-p-line-height: 1.7;
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: var(--theme-body-font);
    font-weight: 400;
    color: #0f172a;
    background: white;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.6;
  }

  h1, h2, h3, h4, h5, h6 {
    font-family: var(--theme-heading-font);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.02em;
  }

  /* Hide dev nav */
  .pala-dev-nav,
  nav.pala-dev-nav {
    display: none !important;
    visibility: hidden !important;
    height: 0 !important;
    overflow: hidden !important;
  }

  /* View Transitions */
  @view-transition {
    navigation: auto;
  }

  ::view-transition-old(root) {
    animation: fade-out 0.2s ease-out;
  }

  ::view-transition-new(root) {
    animation: fade-in 0.3s ease-out;
  }

  @keyframes fade-out {
    from { opacity: 1; }
    to { opacity: 0; }
  }

  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
