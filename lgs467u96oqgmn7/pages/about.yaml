      content: |
        <h2>Our Story</h2>
        <p>SaaSify was founded in 2024 with a simple mission: make it easier for teams to build and ship great software. We believe that developers should spend their time solving problems, not wrestling with infrastructure.</p>

        <h2>Our Mission</h2>
        <p>We're building the all-in-one platform that helps your team build, deploy, and scale applications without the complexity. From startups to enterprises, we're trusted by teams who want to move fast without breaking things.</p>

        <h2>Our Values</h2>
        <ul>
          <li><strong>Ship fast, iterate faster</strong> - We believe in rapid iteration and continuous improvement.</li>
          <li><strong>Developer experience first</strong> - Every feature we build is designed with developers in mind.</li>
          <li><strong>Transparency</strong> - We're open about our roadmap, pricing, and how we operate.</li>
          <li><strong>Customer obsession</strong> - Your success is our success.</li>
        </ul>

