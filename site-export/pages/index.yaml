name: Home
slug: ""
page_type: default
sections:
  - block: hero
    content:
      headline: Build sites with
      headline_highlight: your AI agent.
      headline_suffix: Manage them visually.
      subheadline: Pala represents your entire site as files. Pull it down, edit with Claude Code, Cursor, or any agent, push it back. Your team manages content visually in the browser.
      cta_primary:
        label: Get Started
        url: https://docs.palacms.com/getting-started/installation
      cta_secondary:
        label: See how it works
        url: "#how-it-works"
      github_stars: 2,300+ GitHub stars
      github_url: https://github.com/palacms/palacms
      badges:
        - text: Open Source
        - text: Self-Hosted
        - text: MIT License
      compatible_tools:
        - name: Claude Code
        - name: Cursor
        - name: Windsurf
        - name: GitHub Copilot

  - block: built-for
    content:
      text: <p>Built for <em>developers who build sites for other people</em> — freelancers, agencies, and small teams who want full code control without leaving their clients stranded.</p>

  - block: testimonials
    content:
      label: From the community
      title: People are building with Pala.
      items:
        - quote: Finally, a CMS that doesn't fight against my workflow. I can use Claude Code to build components and my clients can still edit content.
          name: Sarah Chen
          role: Freelance Developer
        - quote: We migrated from WordPress and the difference is night and day. Our developers are happier and our content team actually uses it.
          name: Marcus Johnson
          role: Agency Owner, PixelCraft
        - quote: The file-based approach is genius. I can version control everything and deploy with confidence.
          name: Alex Rivera
          role: Senior Engineer, TechStartup

  - block: how-it-works
    content:
      label: How it works
      title: Describe it. Deploy it. Keep going.
      description: Tell an AI agent what you want. Hand it off to your team. Come back anytime and change anything.
      steps:
        - number: "1"
          title: Pull your site
          description: Run `pala pull` to download your entire site as local files — Svelte components, YAML content, and CSS variables.
        - number: "2"
          title: Edit with any tool
          description: Use Claude Code, Cursor, or any AI agent to modify your site. Or just edit the files directly in your favorite editor.
        - number: "3"
          title: Push changes back
          description: Run `pala push` to sync your changes. Your team sees updates instantly in the visual editor.

  - block: problem
    content:
      text_1: <p>Every CMS makes you choose. Visual builders give editors freedom but <strong>lock developers out of the code</strong>. Developer frameworks give you control but <strong>leave your team staring at a repo they can't use</strong>. Headless CMSes promise both but deliver <strong>months of glue work</strong>.</p>
      text_2: <p>Your site should be something your team edits visually <strong>and</strong> something on your filesystem that any tool can modify. Not one or the other. Both.</p>

  - block: compatible-with
    content:
      label: Compatible with
      title: Any agent that can edit files can edit your site.
      tagline: <p>No integrations. No plugins. You run <code>npx pala pull</code>, your site becomes files, and every tool in your stack just works.</p>
      items:
        - icon: "🤖"
          name: Claude Code
        - icon: "⚡"
          name: Cursor
        - icon: "🌊"
          name: Windsurf
        - icon: "🐙"
          name: GitHub Copilot
        - icon: "💻"
          name: VS Code
        - icon: "🔧"
          name: Any CLI tool

  - block: features
    content:
      label: Everything you'd expect
      title: And everything you wouldn't.
      description: Visual editing, collaboration, static generation - plus your entire site as local files, editable by any tool.
