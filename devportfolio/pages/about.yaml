      title: "From Curiosity to Career"
      bio: "<p>My journey into tech started with curiosity—taking apart gadgets as a kid and wondering how they worked. That curiosity evolved into a passion for building things on the web.</p><p>After graduating with a degree in Computer Science from UC Berkeley, I joined a fast-paced startup where I learned the importance of shipping fast without sacrificing quality. Since then, I've worked with companies ranging from scrappy startups to Fortune 500 enterprises.</p><p>I believe great software is built at the intersection of technical excellence and deep user empathy. Every line of code I write is in service of solving real problems for real people.</p>"
