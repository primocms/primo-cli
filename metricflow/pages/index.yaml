  - block: faq
    content:
      badge: "FAQ"
      title: "Frequently asked questions"
      subtitle: "Everything you need to know about MetricFlow."
      items:
        - question: "How does the free trial work?"
          answer: "Start with our Starter plan completely free, or try Pro free for 14 days. No credit card required. You can upgrade, downgrade, or cancel anytime."
        - question: "What data sources can I connect?"
          answer: "MetricFlow integrates with 50+ tools including Google Ads, Facebook Ads, Google Analytics, Stripe, HubSpot, Salesforce, Shopify, and many more. We also offer a REST API for custom integrations."
        - question: "Is my data secure?"
          answer: "Absolutely. We use bank-level encryption (AES-256) for data at rest and TLS 1.3 for data in transit. We're SOC 2 Type II certified and GDPR compliant. Your data is never sold or shared."
        - question: "Can I export my data?"
          answer: "Yes, you can export all your data at any time in CSV, JSON, or via our API. We believe in data portability and never lock you in."
        - question: "Do you offer custom integrations?"
          answer: "Enterprise plans include custom integration development. Our team will work with you to connect any data source you need, including internal databases and proprietary systems."
        - question: "What kind of support do you offer?"
          answer: "Starter plans include email support. Pro plans include priority email and chat support with a 4-hour response time. Enterprise plans include dedicated account management and 24/7 phone support."

  - block: cta
    content:
      title: "Ready to transform your marketing analytics?"
      subtitle: "Join 2,000+ marketing teams who trust MetricFlow. Start free today."
      primary_cta:
        label: "Start Free Trial"
        url: "#signup"
      secondary_cta:
        label: "Schedule a Demo"
        url: "/demo"

  - block: footer
    content: {}
