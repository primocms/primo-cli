  - block: about
    content:
      section_label: "Who I Am"
      title: "Hey, I'm Jordan"
      content: |
        <p>I'm a writer, reader, and perpetual learner based in San Francisco. For the past decade, I've worked at the intersection of technology and creativity—helping startups find their voice and build products people love.</p>
        <p>But this blog isn't about work. It's about everything else: the books that change how I see the world, the small habits that compound into meaningful change, and the big questions I can't stop thinking about.</p>
        <p><strong>What you'll find here:</strong></p>
        <ul>
          <li>Deep dives into technology's impact on creativity and work</li>
          <li>Book recommendations and reading notes</li>
          <li>Essays on productivity, habits, and intentional living</li>
          <li>Occasional personal stories and experiments</li>
        </ul>
        <p>Thanks for reading. I hope you find something here that makes you think.</p>
      cta:
        label: "Get in touch"
        url: "/contact"
