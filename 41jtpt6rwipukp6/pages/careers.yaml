        <h2>Why Northstar?</h2>
        <p>At Northstar, we believe in the power of collaboration, innovation, and continuous growth. We're not just consultants—we're partners in our clients' success, and we bring the same dedication to building our own team.</p>

        <h3>What We Offer</h3>
        <ul>
          <li><strong>Competitive compensation</strong> with performance bonuses</li>
          <li><strong>Flexible work arrangements</strong> including remote options</li>
          <li><strong>Professional development</strong> budget and mentorship programs</li>
          <li><strong>Comprehensive benefits</strong> including health, dental, and vision</li>
          <li><strong>Generous PTO</strong> plus company holidays</li>
        </ul>

        <h2>Open Positions</h2>

        <h3>Senior Strategy Consultant</h3>
        <p><em>San Francisco, CA or Remote</em></p>
        <p>Lead client engagements, develop strategic recommendations, and mentor junior team members. 5+ years of consulting experience required.</p>

        <h3>Operations Analyst</h3>
        <p><em>New York, NY or Remote</em></p>
        <p>Support operational improvement initiatives through data analysis and process mapping. 2-4 years of experience preferred.</p>

        <h3>Business Development Manager</h3>
        <p><em>San Francisco, CA</em></p>
        <p>Drive new client acquisition and manage key relationships. Strong network in technology or healthcare industries a plus.</p>

        <h2>How to Apply</h2>
        <p>Send your resume and a brief note about why you're interested in Northstar to <a href="mailto:careers@northstarsolutions.com">careers@northstarsolutions.com</a>. We review every application personally.</p>
