            content:
              - type: text
                text: Our Story
          - type: paragraph
            content:
              - type: text
                text: Northstar Solutions was founded in 2009 by a team of former McKinsey consultants who saw an opportunity to bring enterprise-grade strategic thinking to mid-market companies. We believed that every ambitious business deserves access to the insights and frameworks that drive Fortune 500 success.
          - type: paragraph
            content:
              - type: text
                text: Today, we've grown to a team of 45 professionals across offices in San Francisco, New York, and London. We've partnered with over 200 companies across technology, healthcare, manufacturing, and financial services—helping them navigate market shifts, optimize operations, and scale sustainably.
          - type: heading
            attrs:
              level: 2
            content:
              - type: text
                text: Our Approach
          - type: paragraph
            content:
              - type: text
                text: We don't believe in one-size-fits-all solutions. Every engagement begins with deep listening—understanding your unique challenges, market position, and aspirations. From there, we combine rigorous analysis with practical experience to develop strategies that work in the real world.
          - type: paragraph
            content:
              - type: text
                text: Our consultants don't just deliver recommendations and walk away. We roll up our sleeves and work alongside your team to implement changes, measure results, and adjust course as needed. Your success is our success.
  - block: process
    content:
      title: How We Work
      subtitle: Our proven approach to delivering results
      steps:
        - number: "1"
          step_title: Discovery
          description: We start by deeply understanding your business, challenges, and goals through stakeholder interviews and data analysis.
        - number: "2"
          step_title: Strategy
          description: Our team develops tailored recommendations backed by rigorous analysis and industry best practices.
        - number: "3"
          step_title: Implementation
          description: We work alongside your team to execute the strategy, ensuring buy-in and sustainable change.
        - number: "4"
          step_title: Results
          description: We measure outcomes against clear KPIs and iterate to maximize impact and ROI.
