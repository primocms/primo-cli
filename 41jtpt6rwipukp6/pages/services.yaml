  - block: faq
    content:
      title: Frequently Asked Questions
      subtitle: Get answers to common questions about working with us
      items:
        - question: How long does a typical engagement last?
          answer: Engagements vary based on scope and complexity. Strategy projects typically run 8-12 weeks, while transformation initiatives may span 6-12 months. We'll provide a clear timeline during our initial consultation.
        - question: What industries do you specialize in?
          answer: We have deep expertise in technology, healthcare, financial services, and manufacturing. However, our frameworks and methodologies are adaptable to any industry facing strategic or operational challenges.
        - question: How do you measure success?
          answer: We establish clear KPIs at the start of every engagement aligned with your business objectives. These might include revenue growth, cost reduction, efficiency gains, or market share improvements. We track progress continuously and adjust as needed.
        - question: What makes Northstar different from other consulting firms?
          answer: We combine the analytical rigor of top-tier consulting with a hands-on implementation approach. Our consultants don't just deliver recommendations—we work alongside your team to drive real change and measurable results.
        - question: How do we get started?
          answer: It begins with a free consultation call. We'll discuss your challenges, explore potential approaches, and determine if we're the right fit for your needs. There's no obligation—just a conversation to see how we can help.
