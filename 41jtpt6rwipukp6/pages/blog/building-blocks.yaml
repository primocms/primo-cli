          - type: heading
            attrs:
              level: 2
            content:
              - type: text
                text: The Team Performance Gap
          - type: paragraph
            content:
              - type: text
                text: Research consistently shows that high-performing teams outproduce average teams by a factor of three or more. Yet most organizations struggle to consistently build and maintain such teams. The gap isn't about talent—it's about how teams are structured, led, and supported.
          - type: heading
            attrs:
              level: 2
            content:
              - type: text
                text: What High-Performing Teams Do Differently
          - type: heading
            attrs:
              level: 3
            content:
              - type: text
                text: Psychological Safety First
          - type: paragraph
            content:
              - type: text
                text: "Google's Project Aristotle confirmed what organizational psychologists have long understood: psychological safety is the foundation of team performance. When team members feel safe to take risks and be vulnerable, innovation flourishes."
          - type: heading
            attrs:
              level: 3
            content:
              - type: text
                text: Clear Ownership, Not Blurred Lines
          - type: paragraph
            content:
              - type: text
                text: High-performing teams have crystal-clear ownership boundaries. Every outcome has an owner. This doesn't mean siloed work—collaboration happens constantly—but accountability is never ambiguous.
          - type: heading
            attrs:
              level: 3
            content:
              - type: text
                text: Outcome Orientation
          - type: paragraph
            content:
              - type: text
                text: The best teams focus on outcomes, not activities. They measure success by impact delivered, not effort expended. This subtle shift in orientation drives dramatically different behaviors and results.
          - type: heading
            attrs:
              level: 2
            content:
              - type: text
                text: The Role of Leadership
          - type: paragraph
            content:
              - type: text
                text: Leaders of high-performing teams spend less time directing and more time removing obstacles. They create context rather than control, and they invest heavily in developing their people's capabilities.
          - type: heading
            attrs:
              level: 2
            content:
              - type: text
                text: Building the Culture
          - type: paragraph
            content:
              - type: text
                text: Culture isn't created through mission statements or values posters. It emerges from accumulated behaviors, especially from leadership. The behaviors you reward, the behaviors you tolerate, and the behaviors you model all shape the culture your teams operate within.
          - type: heading
            attrs:
              level: 2
            content:
              - type: text
                text: Starting the Journey
          - type: paragraph
            content:
              - type: text
                text: Transforming team performance begins with honest assessment. Survey your teams, observe their interactions, and identify the systemic barriers to excellence. Often, small changes in structure or process can unlock significant improvements.
