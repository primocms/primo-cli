        content:
          - type: paragraph
            content:
              - type: text
                marks:
                  - type: italic
                text: By Sarah Mitchell, Principal Consultant
          - type: heading
            attrs:
              level: 2
            content:
              - type: text
                text: Introduction
          - type: paragraph
            content:
              - type: text
                text: Every business goes through periods of growth and stagnation. The challenge lies in recognizing when temporary setbacks have become systemic issues that require fundamental strategic changes. After two decades of consulting with mid-market companies, we've identified five clear indicators that suggest it's time for a strategic overhaul.
          - type: heading
            attrs:
              level: 2
            content:
              - type: text
                text: 1. Your Growth Has Plateaued Despite Increased Effort
          - type: paragraph
            content:
              - type: text
                text: If you're working harder than ever but your revenue and market share remain flat, something is fundamentally misaligned. This often indicates that your current strategy has reached its natural ceiling. The tactics that brought you here won't take you further.
          - type: heading
            attrs:
              level: 2
            content:
              - type: text
                text: 2. Customer Acquisition Costs Are Rising
          - type: paragraph
            content:
              - type: text
                text: When it costs more to acquire each new customer, your value proposition may be losing relevance. Markets evolve, competitors emerge, and customer expectations shift. Rising CAC is often the first quantitative signal that your positioning needs work.
          - type: heading
            attrs:
              level: 2
            content:
              - type: text
                text: 3. Your Best People Are Leaving
          - type: paragraph
            content:
              - type: text
                text: Top performers have options. When they start leaving, it's rarely just about compensation. More often, they've lost confidence in the company's direction or feel constrained by outdated processes. Retention problems are strategy problems in disguise.
          - type: heading
            attrs:
              level: 2
            content:
              - type: text
                text: 4. You're Competing Primarily on Price
          - type: paragraph
            content:
              - type: text
                text: Price competition is a race to the bottom. If your sales conversations increasingly center on discounts rather than value, it's a sign that differentiation has eroded. Strong strategies create clear value propositions that command premium positioning.
          - type: heading
            attrs:
              level: 2
            content:
              - type: text
                text: 5. Your Industry Is Being Disrupted
          - type: paragraph
            content:
              - type: text
                text: Technology, regulation, or new business models are reshaping most industries. If you're still operating under assumptions from five years ago, you're likely already behind. Proactive strategic evolution beats reactive crisis management every time.
          - type: heading
            attrs:
              level: 2
            content:
              - type: text
                text: What to Do Next
          - type: paragraph
            content:
              - type: text
                text: Recognizing these signs is the first step. The next is conducting an honest assessment of your current position, capabilities, and market opportunities. This isn't about making dramatic changes overnight—it's about building a clear-eyed view of where you are and a practical roadmap to where you need to be.
