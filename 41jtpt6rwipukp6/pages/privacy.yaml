        <h2>Introduction</h2>
        <p>Northstar Solutions ("we," "our," or "us") respects your privacy and is committed to protecting your personal data. This privacy policy explains how we collect, use, and safeguard your information when you visit our website or engage our services.</p>

        <h2>Information We Collect</h2>
        <h3>Information You Provide</h3>
        <ul>
          <li>Contact information (name, email, phone number)</li>
          <li>Company information</li>
          <li>Messages and inquiries you send us</li>
          <li>Information provided during consultations</li>
        </ul>

        <h3>Automatically Collected Information</h3>
        <ul>
          <li>IP address and browser type</li>
          <li>Pages visited and time spent on site</li>
          <li>Referring website addresses</li>
          <li>Device and operating system information</li>
        </ul>

        <h2>How We Use Your Information</h2>
        <p>We use the information we collect to:</p>
        <ul>
          <li>Respond to your inquiries and provide services</li>
          <li>Improve our website and services</li>
          <li>Send relevant updates about our services (with your consent)</li>
          <li>Comply with legal obligations</li>
        </ul>

        <h2>Data Sharing</h2>
        <p>We do not sell your personal information. We may share data with:</p>
        <ul>
          <li>Service providers who assist our operations</li>
          <li>Legal authorities when required by law</li>
          <li>Professional advisors (lawyers, accountants)</li>
        </ul>

        <h2>Data Security</h2>
        <p>We implement appropriate technical and organizational measures to protect your personal data against unauthorized access, alteration, disclosure, or destruction.</p>

        <h2>Your Rights</h2>
        <p>Depending on your location, you may have rights to:</p>
        <ul>
          <li>Access your personal data</li>
          <li>Correct inaccurate data</li>
          <li>Request deletion of your data</li>
          <li>Object to processing</li>
          <li>Data portability</li>
        </ul>

        <h2>Contact Us</h2>
        <p>For privacy-related inquiries, contact us at <a href="mailto:privacy@northstarsolutions.com">privacy@northstarsolutions.com</a> or write to:</p>
        <p>Northstar Solutions<br>548 Market Street, Suite 400<br>San Francisco, CA 94104</p>
