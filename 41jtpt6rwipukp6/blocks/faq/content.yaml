title: Frequently Asked Questions
subtitle: Find answers to common questions about our services
items:
  - question: What services do you offer?
    answer: We offer a comprehensive range of consulting services including digital transformation, cloud migration, data analytics, and security auditing.
  - question: How long does a typical project take?
    answer: Project timelines vary based on scope and complexity. Most projects range from 3-6 months, but we can accommodate both shorter and longer engagements.
  - question: Do you work with small businesses?
    answer: Yes, we work with organizations of all sizes, from startups to enterprise companies. We tailor our approach to meet your specific needs and budget.
  - question: What industries do you specialize in?
    answer: We have expertise across multiple industries including technology, healthcare, finance, retail, and manufacturing.
