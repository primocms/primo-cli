<meta property="og:site_name" content={site_name} />
<link rel="icon" href={favicon.url} />
<meta name="view-transition" content="same-origin" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pala-css@latest/reset.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pala-css@latest/components.css" />

<style>
  :root {
    --theme-primary: #8B4513;
    --theme-primary-dark: #654321;
    --theme-secondary: #D4A574;
    --theme-background: #FFFAF5;
    --theme-background-secondary: #F5EBE0;
    --theme-text: #2C1810;
    --theme-text-muted: #6B5B4F;
    --theme-border-color: #E8DDD4;
    --theme-heading-font: 'Cormorant Garamond', Georgia, serif;
    --theme-body-font: 'Source Sans 3', system-ui, sans-serif;
    --theme-section-padding: 5rem;
    --theme-radius: 8px;
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: var(--theme-body-font);
    font-weight: 400;
    color: var(--theme-text);
    background: var(--theme-background);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.6;
  }

  h1, h2, h3, h4, h5, h6 {
    font-family: var(--theme-heading-font);
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  .pala-dev-nav,
  nav.pala-dev-nav {
    display: none !important;
    visibility: hidden !important;
    height: 0 !important;
    overflow: hidden !important;
  }

  @view-transition {
    navigation: auto;
  }

  ::view-transition-old(root) {
    animation: fade-out 0.2s ease-out;
  }

  ::view-transition-new(root) {
    animation: fade-in 0.3s ease-out;
  }

  @keyframes fade-out {
    from { opacity: 1; }
    to { opacity: 0; }
  }

  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
