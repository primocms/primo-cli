    content: {}

  - block: hero
    content:
      headline: "Crafted with Passion, Served with Love"
      subheadline: "Experience the art of specialty coffee in every cup. Locally roasted, ethically sourced."
      primary_cta:
        label: "View Our Menu"
        url: "#menu"
      secondary_cta:
        label: "Find Us"
        url: "#location"

  - block: menu
    content:
      title: "Our Menu"
      subtitle: "Handcrafted drinks and fresh bites, made with care."
      categories:
        - name: "Espresso Drinks"
          items:
            - item_name: "Espresso"
              description: "Rich and bold, single or double shot"
              price: "$3.50"
            - item_name: "Americano"
              description: "Espresso with hot water"
              price: "$4.00"
            - item_name: "Cappuccino"
              description: "Espresso, steamed milk, and foam"
              price: "$5.00"
            - item_name: "Latte"
              description: "Espresso with steamed milk"
              price: "$5.50"
            - item_name: "Mocha"
              description: "Espresso, chocolate, and steamed milk"
              price: "$6.00"
        - name: "Brewed Coffee"
          items:
            - item_name: "House Blend"
              description: "Our signature medium roast"
              price: "$3.00"
            - item_name: "Pour Over"
              description: "Single origin, made to order"
              price: "$4.50"
            - item_name: "Cold Brew"
              description: "Smooth and refreshing, 16hr steep"
              price: "$4.50"
        - name: "Fresh Baked"
