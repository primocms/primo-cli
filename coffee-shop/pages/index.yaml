            - item_name: "Croissant"
              description: "Buttery and flaky, baked daily"
              price: "$4.00"
            - item_name: "Blueberry Muffin"
              description: "Made with fresh blueberries"
              price: "$3.50"
            - item_name: "Avocado Toast"
              description: "Sourdough, avocado, everything spice"
              price: "$8.00"

  - block: about
    content:
      title: "Our Story"
      content: |
        <p>Founded in 2018, Ember & Brew started with a simple mission: to bring exceptional coffee to our community. What began as a small roasting operation in our garage has grown into a beloved neighborhood gathering spot.</p>
        <p>We source our beans directly from farmers in Colombia, Ethiopia, and Guatemala, ensuring fair prices and sustainable practices. Every batch is roasted in-house to bring out the unique flavors and aromas that make specialty coffee special.</p>
